[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "IMDgroup-gorun"
version = "0.1.0"
description = "Slurm job submission helpers for Inverse Materials Design group"
authors = [ {name = "Ihor Radchenko", email = "yantar92@posteo.net"},
	    {name = "Oleksandr I. Malyi", email = "oleksandrmalyi@gmail.com"}]
readme = {file = "README.org", content-type = "text/x-org"}
keywords = ["crystal", "materials", "science", "cluster", "VASP", "MACE", "slurm", "ase"]
classifiers = [
	    "Development Status :: 2 - Pre-Alpha",
            "Environment :: Console",
            "Intended Audience :: Science/Research",
            "License :: OSI Approved :: MIT License",
            "Operating System :: POSIX :: Linux",
            "Programming Language :: Python :: 3.12",
            "Topic :: System :: Clustering",
            "Topic :: Scientific/Engineering :: Chemistry",
            "Topic :: Scientific/Engineering :: Information Analysis",
            "Topic :: Scientific/Engineering :: Physics"]
requires-python = ">=3.11"
dependencies = [ "ase", "termcolor", "IMDgroup-pymatgen", "python-dateutil"]

[project.urls]
homepage = "https://www.oimalyi.org/"

[project.optional-dependencies]
dev = ["python-lsp-server[all]"]
mace = ["pandas", "scikit-learn"]

[project.scripts]
gorun2 = "IMDgroup.gorun.gorun:main"
gorun2-mace = "IMDgroup.gorun.gorun:main_mace"
gorun2-mace-finetune = "IMDgroup.gorun.gorun:main_mace"
gorun2-atat-local = "IMDgroup.gorun.gorun_atat_local:main"
gorun2-maps = "IMDgroup.gorun.gorun_maps:main"

[tool.uv.sources]
IMDgroup-pymatgen = { path = "../IMDgroup-pymatgen" }

[tool.setuptools]
script-files = ["scripts/gorun-all-ready.sh"]

[tool.setuptools.packages.find]
exclude = ["tests"]
where = ["src/"]
include = [
	"IMDgroup",
	"IMDgroup.gorun",
	"IMDgroup.gorun.core",
	"IMDgroup.gorun.adapters",
	"IMDgroup.gorun_maps",
        "IMDgroup.gorun_atat_local",
        "IMDgroup.sbatch"]

[tool.pylint]
source-roots=['./src']