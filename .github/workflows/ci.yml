name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Integration tests run at most once per day.
    - cron: "17 3 * * *"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests
        run: pytest -m "not integration"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only on the daily schedule or a manual dispatch; not on every
    # push or pull request, so they run at most once per day.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: pip install -e ".[test]"

      - name: Run integration tests
        run: pytest -m integration
